name: Format social sensing research branch
on:
  push:
    branches:
      - research/social-recognition-sensory-foundation
    paths:
      - .github/workflows/topic-format-social.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'topherchris420/lop-nur-twin'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/social-recognition-sensory-foundation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: bunx prettier --write src/bethesda/firstContact/socialSensing.ts src/bethesda/firstContact/socialSensing.test.ts docs/SOCIAL_RECOGNITION_ROADMAP.md
      - name: Commit only formatted research files
        run: |
          git add src/bethesda/firstContact/socialSensing.ts src/bethesda/firstContact/socialSensing.test.ts docs/SOCIAL_RECOGNITION_ROADMAP.md
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(research): format social sensing experiment'
          git push origin HEAD:refs/heads/research/social-recognition-sensory-foundation
