name: Claims regeneration diagnostic
on:
  pull_request:
    paths:
      - ".github/workflows/claims-diagnostic.yml"
      - "README.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diff-generated-claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - name: Regenerate and inspect stale evidence reports
        run: |
          node scripts/run-ts.mjs scripts/claim-bindings.ts --write
          git diff --stat -- docs/claims/
          git diff -- docs/claims/README.md
          git diff -- docs/claims/bindings.json | head -c 30000
