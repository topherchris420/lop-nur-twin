name: R.A.I.N. institutional memory

on:
  pull_request:
    paths:
      - "experiments/crosslab/institution/**"
      - "experiments/crosslab/assumptions/**"
      - "experiments/crosslab/replication/acquisition.py"
      - "public/research-memory/**"
      - ".github/workflows/rain-institutional-memory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-scoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: topherchris420/circle
          ref: 0f231ec41f3a1bd0cf47d347dc2b6068dc5fb7da
          path: instruments/circle
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: topherchris420/rain-atlas
          ref: a876d458778b0917541a26153d2425b922762480
          path: instruments/atlas
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5 jsonschema==4.26.0
      - name: Replay the correction and score the published results
        run: |
          study=experiments/crosslab/institution
          python -m unittest discover -s "$study" -p 'test_*.py'
          python "$study/study.py" instruments/circle instruments/atlas "$RUNNER_TEMP/correction"
          python "$study/evaluation.py" > "$RUNNER_TEMP/correction/evaluation.json"
          python "$study/verify_release.py" "$RUNNER_TEMP/correction" "$RUNNER_TEMP/correction/evaluation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rain-correction-and-evaluation
          path: ${{ runner.temp }}/correction
          if-no-files-found: error
