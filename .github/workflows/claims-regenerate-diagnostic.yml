name: Diagnose generated research-claims reports

# Temporary, read-only diagnostic for the CI failure. Removed before review.
on:
  push:
    branches:
      - fix/claims-report-main-20261113

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - name: Regenerate report and print exact patch
        shell: bash
        run: |
          node scripts/run-ts.mjs scripts/claim-bindings.ts --write
          node scripts/run-ts.mjs scripts/claim-bindings.ts --check
          echo "----- REGENERATED REPORT DIFF -----"
          git diff -- docs/claims/README.md docs/claims/bindings.json
          echo "----- END DIFF -----"
          echo "----- MODIFIED FILES -----"
          git status --short
