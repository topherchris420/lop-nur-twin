name: Landscape review captures
on:
  push:
    branches: [qa/landscape-light-captures-20261120]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        world: [airfield, airfield-original, bethesda, blacksite, field-plate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.world == 'airfield-original' && 'ceaadfc3337311a9ba00bf5db00dec319fbd55f7' || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Start the application
        run: |
          mkdir -p shots/review
          bun run dev --host 127.0.0.1 --port 5173 > /tmp/lookdev.log 2>&1 &
          timeout 180 bash -c 'until curl -sf http://127.0.0.1:5173/ >/dev/null; do sleep 2; done'
      - name: Use the same capture readiness check on the archived version
        if: matrix.world == 'airfield-original'
        run: curl -fsSL https://raw.githubusercontent.com/topherchris420/lop-nur-twin/68b7128c8e74a0550432b8cf8548cfffd41bf717/tools/lookdev.mjs -o tools/lookdev.mjs
      - name: Capture the opening airfield
        if: startsWith(matrix.world, 'airfield')
        run: >
          node tools/lookdev.mjs --origin http://127.0.0.1:5173 --quality 2 --width 1280 --height 720 --out shots/review
          --shots '[{"id":"opening","route":"twin","frames":5},{"id":"aerial","route":"twin","setup":"await ld.twinOblique()","frames":5}]'
      - name: Verify both airfield cameras reached daylight
        if: startsWith(matrix.world, 'airfield')
        run: node -e "const f=require('./shots/review/manifest.json'); if(f.shots.length!==2 || f.pageErrors.length || f.shots.some(s=>!s.luma || s.luma<0.15)) process.exit(1)"
      - name: Capture the accessible field plate at two viewport sizes
        if: matrix.world == 'field-plate'
        run: node tools/field-plate-review.mjs
      - name: Walk and survey Bethesda
        if: matrix.world == 'bethesda'
        run: node tools/bethesda-look.mjs http://127.0.0.1:5173 shots/review
      - name: Download the original Blacksite frames
        if: matrix.world == 'blacksite'
        uses: actions/download-artifact@v4
        with:
          run-id: 44844474337
          name: landscape-blacksite
          path: /tmp/original-landscape
          github-token: ${{ github.token }}
      - name: Run the nine look-development cameras
        if: matrix.world == 'blacksite'
        run: node tools/lookdev.mjs --set ab --origin http://127.0.0.1:5173 --width 896 --height 504 --quality 3 --out shots/review --compare /tmp/original-landscape
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-${{ matrix.world }}
          path: shots/review
          retention-days: 5
