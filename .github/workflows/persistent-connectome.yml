name: Persistent connectome continuity

on:
  pull_request:
    paths:
      - "fly-neural/**"
      - "deploy/garden/service/**"
      - "scripts/eva_persistent_connectome.py"
      - ".github/workflows/persistent-connectome.yml"
  push:
    branches: [main]
    paths:
      - "fly-neural/**"
      - "deploy/garden/service/**"
      - "scripts/eva_persistent_connectome.py"
      - ".github/workflows/persistent-connectome.yml"

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e './fly-neural[test]'
      - run: python -m pytest -q fly-neural/tests/test_persistent.py fly-neural/tests/test_whole_brain.py
