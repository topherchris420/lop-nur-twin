name: Acquire BANC v888 public connectome (research-only)

# Explicit user-requested, one-shot research acquisition. Never deploys.
# BANC data stay out of Git, production, and the original flies' VMs.
on:
  push:
    branches:
      - research/banc-v888-acquire-data
    paths:
      - .github/workflows/banc-v888-data.yml
      - fly-neural/fly_neural/banc_public.py
      - fly-neural/tests/test_banc_public.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FLY_NEURAL_DATA: /tmp/banc-research-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install existing BANC importer
        run: python -m pip install -e './fly-neural[test]'
      - name: Verify isolated converter and provenance checks with synthetic data
        run: python -m pytest -q fly-neural/tests/test_banc_public.py fly-neural/tests/test_banc.py fly-neural/tests/test_isolation.py
      - name: Acquire official public v888 metadata and connectivity
        run: python -m fly_neural.banc_public fetch --accept-cc-by-4.0
      - name: Validate schema, convert, and pin local SHA-256 hashes
        run: python -m fly_neural.banc_public prepare
      - name: Compile into the isolated research neural engine
        run: python -m fly_neural.banc_public import
      - name: Record data attribution, stats and exact checksums
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, hashlib
          base = pathlib.Path(os.environ['FLY_NEURAL_DATA'])
          d = base / 'public-banc/v888'
          pin = json.loads((d/'source-manifest.json').read_text())
          compiled = base / 'compiled/banc-v888-public-predicted-nt'
          manifests = list(compiled.glob('manifest.json'))
          print('Raw published v888 products and local checksums:')
          for role, info in pin['source_products'].items():
              print(role, info['url'], info['bytes'], info['sha256'])
          print('Derived table hashes:')
          print(json.dumps(pin['derived_tables'],indent=2,sort_keys=True))
          if manifests:
              neural = json.loads(manifests[0].read_text())
              print('Research graph:', json.dumps(neural.get('counts',{}), indent=2))
          (d/'ATTRIBUTION.txt').write_text(
              'BANC v888 (brain-and-nerve-cord connectome)\n'
              'Bates et al. (2026), Distributed control circuits across a brain-and-cord connectome, Nature.\n'
              'DOI: https://doi.org/10.1038/s41586-026-10735-w\n'
              'Data: https://doi.org/10.7910/DVN/7WTH1N\n'
              'License: CC BY 4.0 (verify release-specific terms).\n'
              'Source: https://storage.googleapis.com/lee-lab_brain-and-nerve-cord-fly-connectome/\n'
              'Acquired from current public bucket; no independently published checksum is claimed.\n'
              'Data and compiled network are for research only, never Eva/ECHO production.\n'
          )
          PY
      - name: Upload actual v888 source files and validated model as downloadable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BANC-v888-public-release-research
          path: |
            /tmp/banc-research-data/public-banc/v888/
            /tmp/banc-research-data/compiled/banc-v888-public-predicted-nt/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
