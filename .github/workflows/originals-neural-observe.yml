name: Original lives, read-only neural observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check research code formatting
        run: bunx prettier --check scripts/original-neural-shadow.ts src/bethesda/firstContact/liveNeural.ts src/bethesda/firstContact/liveNeural.test.ts docs/ORIGINALS_LIVE_NEURAL_SHADOW.md
      - name: Check proxy provenance and unknown-input handling
        run: bunx vitest run src/bethesda/firstContact/liveNeural.test.ts
      - name: Read the originals through existing public GET-only observers
        run: node scripts/run-ts.mjs scripts/first-contact-observe.ts --seconds 30
      - name: Verify original identities and record neural-input coverage
        run: node scripts/run-ts.mjs scripts/original-neural-shadow.ts --max-samples 3
      - name: Preserve summaries without publishing raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-lives-observation-summary
          path: |
            .first-contact/observe/summary.json
            .first-contact/original-neural-shadow/report.json
          if-no-files-found: warn
          retention-days: 7
