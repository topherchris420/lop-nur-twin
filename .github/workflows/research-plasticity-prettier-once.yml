name: Research branch formatting diagnostics
on:
  push:
    branches:
      - research/echo-plasticity-continuation-20261107
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Show exact suggested formatting patch (read-only)
        run: |
          bunx prettier --write docs/EVA_ECHO_ACTIVATION.md src/bethesda/life/bethesdaStore.ts src/bethesda/life/plasticOrganism.ts src/bethesda/life/plasticityContinuation.ts src/bethesda/life/plasticityContinuation.test.ts scripts/bethesda-life-headless.ts scripts/bethesda-life-continue-plasticity.ts
          git diff --check
          git diff -- docs/EVA_ECHO_ACTIVATION.md src/bethesda/life/bethesdaStore.ts src/bethesda/life/plasticOrganism.ts src/bethesda/life/plasticityContinuation.ts src/bethesda/life/plasticityContinuation.test.ts scripts/bethesda-life-headless.ts scripts/bethesda-life-continue-plasticity.ts
