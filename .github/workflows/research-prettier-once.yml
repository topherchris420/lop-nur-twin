name: One-shot research formatting

on:
  push:
    branches:
      - research/eva-echo-brain-plasticity-20261107
    paths:
      - .github/workflows/research-prettier-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'topherchris420/lop-nur-twin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Apply repository Prettier exactly
        run: |
          bunx prettier --write docs/EVA_ECHO_BRAIN_PLASTICITY.md src/bethesda/fly/echo/adaptiveBrain.test.ts docs/BANC_PUBLIC_GENESIS.md .github/workflows/banc-v888-data.yml
      - name: Show exact formatting patch for review (no bot push)
        run: |
          git diff --check
          git diff -- docs/EVA_ECHO_BRAIN_PLASTICITY.md src/bethesda/fly/echo/adaptiveBrain.test.ts docs/BANC_PUBLIC_GENESIS.md .github/workflows/banc-v888-data.yml
