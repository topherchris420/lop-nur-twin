name: One-shot research formatting

on:
  push:
    branches:
      - research/eva-echo-brain-plasticity-20261107
    paths:
      - .github/workflows/research-prettier-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'topherchris420/lop-nur-twin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Apply repository Prettier exactly
        run: |
          bunx prettier --write docs/EVA_ECHO_BRAIN_PLASTICITY.md src/bethesda/fly/echo/adaptiveBrain.test.ts docs/BANC_PUBLIC_GENESIS.md .github/workflows/banc-v888-data.yml
      - name: Commit formatting only on the research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EVA_ECHO_BRAIN_PLASTICITY.md src/bethesda/fly/echo/adaptiveBrain.test.ts docs/BANC_PUBLIC_GENESIS.md .github/workflows/banc-v888-data.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format brain research and BANC provenance"
            git push origin HEAD:research/eva-echo-brain-plasticity-20261107
          fi
