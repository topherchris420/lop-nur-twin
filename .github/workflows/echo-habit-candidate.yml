name: ECHO habit candidate formatting and focused tests

on:
  push:
    branches:
      - feat/echo-original-habit-continuation

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Compute formatting patch without touching repository
        run: |
          bunx prettier --write docs/ECHO_EXPERIENTIAL_CONTINUATION.md scripts/bethesda-life-continue-habits.ts src/bethesda/life/bethesdaStore.ts src/bethesda/life/experientialHabits.ts src/bethesda/life/habitContinuation.test.ts src/bethesda/life/habitContinuation.ts src/bethesda/life/habitOrganism.ts src/bethesda/life/organism.ts
          git diff -- docs/ECHO_EXPERIENTIAL_CONTINUATION.md scripts/bethesda-life-continue-habits.ts src/bethesda/life/bethesdaStore.ts src/bethesda/life/experientialHabits.ts src/bethesda/life/habitContinuation.test.ts src/bethesda/life/habitContinuation.ts src/bethesda/life/habitOrganism.ts src/bethesda/life/organism.ts
      - name: Run habit-preservation tests
        run: bunx vitest run src/bethesda/life/habitContinuation.test.ts
      - name: Type-check new ECHO continuation
        run: bunx tsc --noEmit
