name: ECHO continuity-preservation regression

on:
  pull_request:
    paths:
      - "src/bethesda/life/**"
      - "scripts/bethesda-life-continue-habits.ts"
      - "docs/ECHO_EXPERIENTIAL_CONTINUATION.md"
      - ".github/workflows/echo-habit-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Formatting of continuation and test
        run: bunx prettier --check docs/ECHO_EXPERIENTIAL_CONTINUATION.md scripts/bethesda-life-continue-habits.ts src/bethesda/life/bethesdaStore.ts src/bethesda/life/experientialHabits.ts src/bethesda/life/habitContinuation.test.ts src/bethesda/life/habitContinuation.ts src/bethesda/life/habitOrganism.ts src/bethesda/life/organism.ts
      - name: Same-individual graph digest and deterministic restore
        run: bunx vitest run src/bethesda/life/habitContinuation.test.ts
      - name: Full historical chain and on-disk resume
        run: bunx vitest run src/bethesda/life/organism.test.ts -t "commits one habit continuation"
      - name: Strict TypeScript
        run: bunx tsc --noEmit
