name: Temporary README formatting
on:
  push:
    branches:
      - docs/readme-visual-field-guide-20261118

permissions:
  contents: write

jobs:
  prettier:
    if: github.event.head_commit.message != 'chore: format README visual showcase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-visual-field-guide-20261118
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - name: Apply repository's Prettier formatting
        run: bunx prettier --write README.md docs/media/readme/GALLERY.md tools/readme-media.mjs
      - name: Commit only formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/media/readme/GALLERY.md tools/readme-media.mjs
          if ! git diff --cached --quiet; then
            git commit -m "chore: format README visual showcase"
            git push origin HEAD:docs/readme-visual-field-guide-20261118
          fi
