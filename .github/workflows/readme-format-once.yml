# One-time, path-scoped repair for the documented README formatting CI failure.
# Remove this workflow after it formats README.md.
name: One-time README formatting repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-format-once.yml
permissions:
  contents: write
jobs:
  format-readme:
    if: github.repository == 'topherchris420/lop-nur-twin'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install declared tooling
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - name: Format README only
        run: |
          bunx prettier --write README.md
          git add README.md
          if git diff --cached --quiet; then
            echo "README already formatted"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898579+github-actions[bot]@users.noreply.github.com" \
            commit -m "style(readme): apply repository Prettier formatting"
          git push origin HEAD:main
