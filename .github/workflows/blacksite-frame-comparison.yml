name: Blacksite frame comparison
on:
  push:
    branches: [qa/blacksite-flightline-20261122]
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Capture the fixed gameplay cameras
        run: |
          bun run dev --host 127.0.0.1 --port 5173 > /tmp/blacksite-vite.log 2>&1 &
          timeout 100 bash -c 'until curl -sf http://127.0.0.1:5173/play > /dev/null; do sleep 2; done'
          node tools/lookdev.mjs --set ab --width 960 --height 540 --origin http://127.0.0.1:5173 --out frames
          node tools/lookdev.mjs --shots '[{"id":"hangar-front","setup":"await ld.place(925,1364,190,0.08)"},{"id":"hangar-night","setup":"ld.night(true); await ld.place(925,1364,190,0.08)","frames":62}]' --width 960 --height 540 --origin http://127.0.0.1:5173 --out front
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blacksite-gameplay
          path: |
            frames/
            front/
            /tmp/blacksite-vite.log
          retention-days: 7
