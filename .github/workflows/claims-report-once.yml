name: One-time claims report regeneration

on:
  push:
    branches:
      - fix/claims-report-sync-20261119

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/claims-report-sync-20261119
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Regenerate and verify claim bindings
        run: |
          bun run claims:write
          bun run claims:check
          bunx vitest run scripts/claims/claims.test.ts
          bunx prettier --check docs/claims/README.md docs/claims/bindings.json
      - name: Commit only generated reports and remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/claims/README.md docs/claims/bindings.json
          if git diff --cached --quiet; then
            echo 'Expected changed claim report files, but none were generated' >&2
            exit 1
          fi
          git rm -- .github/workflows/claims-report-once.yml
          git commit -m 'fix(ci): synchronize generated claim reports with README'
          git push origin HEAD:fix/claims-report-sync-20261119
