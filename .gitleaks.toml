# Extends the built-in Gitleaks rules. This file only records false positives.
# Do not add a path here unless the captured value is also constrained: a
# path-only allowlist would hide a real credential in that file.
title = "lop-nur-twin"

[extend]
useDefault = true

# `customProgramCacheKey` versions in the soldier shader. The identifier is
# named CACHE_KEY, so the generic-api-key rule treats
# `soldier-shade-vN` as a credential. It is a public Three.js program-cache
# version. Both checks are required: the secret must be exactly that version
# string, and it must be in this file. Any other value in the file still fails.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Three.js customProgramCacheKey versions in src/game/characters/soldierShade.ts (soldier-shade-vN). Not a credential."
condition = "AND"
regexTarget = "secret"
regexes = ['''^soldier-shade-v\d+$''']
paths = ['''(^|/)src/game/characters/soldierShade\.ts$''']

# The migration pins the public Git commit of the engine that wrote the
# deployed checkpoint. Gitleaks mistakes this bare 40-hex SHA for a
# Sourcegraph token. Permit only this exact public SHA in this exact file.
[[rules]]
id = "sourcegraph-access-token"

[[rules.allowlists]]
description = "Public c8b5fb1 engine commit pinned by the ECHO migration, not a credential."
condition = "AND"
regexTarget = "secret"
regexes = ['''^c8b5fb163b22381fb08c3c0f4a18d5b92bfc2f4b$''']
paths = ['''(^|/)src/bethesda/life/echoUpgrade\.ts$''']
