# Extends the built-in Gitleaks rules. This file only records false positives.
# Do not add a path here unless the captured value is also constrained: a
# path-only allowlist would hide a real credential in that file.
title = "lop-nur-twin"

[extend]
useDefault = true

# `customProgramCacheKey` versions in the soldier shader. The identifier is
# named CACHE_KEY, so the generic-api-key rule treats
# `soldier-shade-vN` as a credential. It is a public Three.js program-cache
# version. Both checks are required: the secret must be exactly that version
# string, and it must be in this file. Any other value in the file still fails.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Three.js customProgramCacheKey versions in src/game/characters/soldierShade.ts (soldier-shade-vN). Not a credential."
condition = "AND"
regexTarget = "secret"
regexes = ['''^soldier-shade-v\d+$''']
paths = ['''(^|/)src/game/characters/soldierShade\.ts$''']

# The migrations pin the public Git commits of the engines that wrote the
# deployed checkpoints. Gitleaks mistakes a bare 40-hex SHA for a
# Sourcegraph token. Permit only these exact public SHAs in this exact file.
[[rules]]
id = "sourcegraph-access-token"

[[rules.allowlists]]
description = "Public c8b5fb1 engine commit pinned by the ECHO migration, not a credential."
condition = "AND"
regexTarget = "secret"
regexes = ['''^c8b5fb163b22381fb08c3c0f4a18d5b92bfc2f4b$''']
paths = ['''(^|/)src/bethesda/life/echoUpgrade\.ts$''']

[[rules.allowlists]]
description = "Public 3db627b engine commit pinned by the ECHO v3 continuation, not a credential."
condition = "AND"
regexTarget = "secret"
regexes = ['''^3db627bc125415093d6507988a2d8f61949f5240$''']
paths = ['''(^|/)src/bethesda/life/echoUpgrade\.ts$''']

# The organism continuation pins the public d25e1f3 (ECHO v3) commit as its
# only source release, and its report and rehearsal name it and 3db627b.
# These files also say `sourceGraphDigest`, which matches the rule's
# "sourcegraph" keyword. Again only these exact SHAs, in these exact files.
[[rules.allowlists]]
description = "Public d25e1f3 engine commit required as the organism continuation's source release, not a credential."
condition = "AND"
regexTarget = "secret"
regexes = ['''^d25e1f3b9e40c5ded3f8ce1f435365d5c6c80592$''']
paths = [
  '''(^|/)src/bethesda/life/organism\.ts$''',
  '''(^|/)docs/ECHO_ORGANISM_CONTINUATION\.md$''',
  '''(^|/)docs/research/echo-organism-continuation/rehearse\.ts$''',
]

[[rules.allowlists]]
description = "Public 3db627b engine commit whose release the organism rehearsal rebuilt, not a credential."
condition = "AND"
regexTarget = "secret"
regexes = ['''^3db627bc125415093d6507988a2d8f61949f5240$''']
paths = ['''(^|/)docs/research/echo-organism-continuation/rehearse\.ts$''']

# The cutover's record, cutover.txt, holds its outputs as they ran: they name
# the deployed release (62bd125), its source (d25e1f3) and the replay release
# (3db627b) in full, beside `sourceGraphDigest`, and the report names the
# deployed release. Again only these exact SHAs, in these exact files.
[[rules.allowlists]]
description = "Public 62bd125 commit, the organism release the cutover deployed, named by its report and record, not a credential."
condition = "AND"
regexTarget = "secret"
regexes = ['''^62bd12502c17379b92e89c74d17b3e1240ddd243$''']
paths = [
  '''(^|/)docs/ECHO_ORGANISM_CONTINUATION\.md$''',
  '''(^|/)docs/research/echo-organism-continuation/cutover\.txt$''',
]

[[rules.allowlists]]
description = "Public d25e1f3 and 3db627b engine commits, the source and replay releases the cutover's record names, not credentials."
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^d25e1f3b9e40c5ded3f8ce1f435365d5c6c80592$''',
  '''^3db627bc125415093d6507988a2d8f61949f5240$''',
]
paths = ['''(^|/)docs/research/echo-organism-continuation/cutover\.txt$''']
