# nginx configuration for the container image built by ../Dockerfile.
#
# Serves the static Vite build with the same security headers `vercel.json`
# and `vite.config.ts` (preview) set, so the hosted demo and an evaluator's
# local container behave identically.
#
# Runs unprivileged: the base image is nginx-unprivileged, which listens on
# 8080 as uid 101 and keeps its temporary paths under /tmp. Nothing here needs
# root, and nothing here needs a secret.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact server build.
    server_tokens off;

    # Bodies are never accepted — this is a static site with no API.
    client_max_body_size 1k;

    # ---------------------------------------------------------------- headers
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://api.adsb.lol; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # ------------------------------------------------------------ health path
    # Documented health check for a load balancer or orchestrator. It returns
    # a fixed string and touches no application state.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # -------------------------------------------------------------- artifacts
    # Hashed bundles are immutable; the manifest describes *this* build and
    # must not be served from a stale cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /model-manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------- api
    # The Jev decision endpoint is a Vercel Function and holds a server-side
    # credential; this image serves static files only and has neither. Answer
    # with the endpoint's own error shape, so `/play?brain=jev` reports
    # JEV UNAVAILABLE instead of receiving the app shell.
    # No add_header here: one in a location drops every server-level header.
    # The body is never read; the size cap is lifted only so a POSTed
    # observation reaches this answer rather than a 413 page.
    location ^~ /api/ {
        client_max_body_size 16k;
        default_type application/json;
        return 404 '{"schemaVersion":"blacksite-jev-decision/v1","sequence":null,"error":{"code":"not_configured","message":"This deployment has no Jev decision service."},"retryAfterMs":null}';
    }

    # ----------------------------------------------------------- SPA fallback
    # `/play`, `/analysis` and any deep link must load when opened directly and
    # must survive a refresh, so anything that is not a real file falls back to
    # the app shell. Real files are still served as themselves, which is why
    # this cannot 404 an asset.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Dot-files are never part of the build output.
    location ~ /\. {
        deny all;
    }
}
