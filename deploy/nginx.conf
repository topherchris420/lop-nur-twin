# nginx configuration for the container image built by ../Dockerfile.
#
# Serves the static Vite build with the same security headers `vercel.json`
# and `vite.config.ts` (preview) set — from deploy/security-headers.conf — so
# the hosted demo and an evaluator's local container behave identically.
#
# Runs unprivileged: the base image is nginx-unprivileged, which listens on
# 8080 as uid 101 and keeps its temporary paths under /tmp. Nothing here needs
# root, and nothing here needs a secret.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact server build.
    server_tokens off;

    # Bodies are never accepted — this is a static site with no API.
    client_max_body_size 1k;

    # ---------------------------------------------------------------- headers
    # The same security headers as vercel.json, from one file. Every location
    # below that sets a header of its own includes it again, because a location
    # with any add_header inherits none from here.
    include /etc/nginx/snippets/lop-nur-security-headers.conf;

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # ------------------------------------------------------------ health path
    # Documented health check for a load balancer or orchestrator. It returns
    # a fixed string and touches no application state.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -------------------------------------------------------------- artifacts
    # Hashed bundles are immutable; the manifest describes *this* build and
    # must not be served from a stale cache.
    location /assets/ {
        include /etc/nginx/snippets/lop-nur-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /model-manifest.json {
        default_type application/json;
        include /etc/nginx/snippets/lop-nur-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------- api
    # The decision endpoints and the R.A.I.N. runtime are Vercel Functions, and
    # the decision endpoints hold server-side credentials; this image serves
    # static files only and has neither. Each family is answered the way its
    # client reads "not here", so the app degrades honestly instead of
    # receiving the app shell: /play?brain=jev|glide|llm reports UNAVAILABLE,
    # and the R.A.I.N. Lab answers as a site with its runtime switched off
    # (OFFLINE). No add_header here, so the server-level security headers
    # apply. Bodies are never read; the size caps are lifted only so a POSTed
    # request reaches these answers rather than a 413 page.
    location = /api/rain/status {
        default_type application/json;
        return 200 '{"schema":"rain-bethesda/v2","kind":"status","configured":false,"reachable":null,"identity":null,"failure":null}';
    }

    location ^~ /api/rain/ {
        client_max_body_size 1m;
        default_type application/json;
        return 503 '{"schema":"rain-bethesda/v2","kind":"error","error":"not configured"}';
    }

    location ^~ /api/ {
        client_max_body_size 16k;
        default_type application/json;
        return 404 '{"schemaVersion":"blacksite-jev-decision/v3","sequence":null,"error":{"code":"not_configured","message":"This deployment has no decision service."},"retryAfterMs":null}';
    }

    # ----------------------------------------------------------- SPA fallback
    # `/play`, `/analysis` and any deep link must load when opened directly and
    # must survive a refresh, so anything that is not a real file falls back to
    # the app shell. Real files are still served as themselves, which is why
    # this cannot 404 an asset.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/lop-nur-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Dot-files are never part of the build output.
    location ~ /\. {
        deny all;
    }
}
