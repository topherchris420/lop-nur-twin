# Security headers for every response from the container image.
#
# Included once at server level and again in every location of nginx.conf that
# sets a header of its own: nginx drops *all* inherited add_header directives in
# a location that declares one, so a Cache-Control line alone would serve the
# app shell with no CSP. src/lib/deployHeaders.test.ts fails if a location sets
# a header without including this file, or if a value here drifts from
# vercel.json. HSTS is left to whoever terminates TLS in front of the container.
#
# The Dockerfile copies this file to /etc/nginx/snippets/.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://api.adsb.lol; manifest-src 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
