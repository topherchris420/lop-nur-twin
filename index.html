<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lop Nur Twin — an unclassified public-source analytical reconstruction of a desert airfield, with a labelled evidence ledger, an accessible analysis table, and an illustrative simulation layer. Not operational data."
    />
    <!-- Keeps this origin out of third-party referrer logs when a citation is
         opened; outbound links also carry rel="noopener noreferrer". -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23211d16'/%3E%3Cpath d='M6 26 L26 6' stroke='%23d8d3c4' stroke-width='5'/%3E%3Cpath d='M16 26 L26 16' stroke='%23a0906c' stroke-width='3'/%3E%3C/svg%3E"
    />
    <title>Lop Nur Twin — public-source digital twin</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #14120e;
        overflow: hidden;
      }
      /* Shown only when scripts are off or blocked; see the <noscript> below. */
      .no-script {
        /* Over the empty root, which fills the page and would push it out of view. */
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        overflow: auto;
        padding: 2rem 1.25rem;
        color: #e9e4d6;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }
      .no-script > * {
        max-width: 38rem;
        margin-inline: auto;
      }
      /* The stylesheet resets headings, lists and links; these put them back. */
      .no-script h1 {
        margin-bottom: 1rem;
        font-size: 1.5rem;
        font-weight: 600;
      }
      .no-script p,
      .no-script ul {
        margin-bottom: 1rem;
      }
      .no-script ul {
        padding-left: 1.25rem;
        list-style: disc;
      }
      .no-script a {
        color: #e3c98a;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Every view here is drawn by scripts. Without them the page was an empty
         dark screen with no word of why; this says so, and points at what can be
         read without them. -->
    <noscript>
      <main class="no-script">
        <h1>Lop Nur Twin</h1>
        <p>
          This site needs JavaScript, which is off or blocked in this browser. The 3D
          twin, the analysis table and the other views are all drawn by scripts, so
          nothing has loaded and nothing is hidden behind this notice.
        </p>
        <p>The project's documents can be read without scripts:</p>
        <ul>
          <li>
            <a
              href="https://github.com/topherchris420/lop-nur-twin#readme"
              rel="noopener noreferrer"
              >what the project is</a
            >
          </li>
          <li>
            <a
              href="https://github.com/topherchris420/lop-nur-twin/blob/main/docs/RESEARCH_CLAIMS.md"
              rel="noopener noreferrer"
              >every claim it makes, with its evidence</a
            >
          </li>
          <li>
            <a
              href="https://github.com/topherchris420/lop-nur-twin/blob/main/docs/SITE_MODEL.md"
              rel="noopener noreferrer"
              >the site model and its sources</a
            >
          </li>
        </ul>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
